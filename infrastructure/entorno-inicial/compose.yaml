# Independiente del Compose local; ejecutar con nombre de proyecto fijo.
services:
  proxy:
    image: ${CADDY_IMAGE:?Fijar imagen Caddy aprobada por digest sha256}
    environment:
      INTEGRATION_DOMAIN: ${INTEGRATION_DOMAIN:?Dominio exclusivo de integración}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend]
    depends_on:
      app:
        condition: service_healthy
    cpus: 1
    restart: unless-stopped
    logging: &bounded_logs
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: ${APP_IMAGE:?Fijar imagen del commit fusionado por digest sha256}
    env_file:
      - ${APP_ENV_FILE:?Ruta absoluta a archivo secreto fuera del repo}
    environment:
      APP_URL: https://${INTEGRATION_DOMAIN:?Dominio exclusivo de integración}
      DATABASE_URL: postgresql://nutripey:${POSTGRES_PASSWORD:?Contraseña hexadecimal}@db:5432/nutripey
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, database]
    cpus: 1
    restart: unless-stopped
    logging: *bounded_logs
  db:
    image: ${POSTGRES_IMAGE:?Fijar postgres 18.6-bookworm por digest sha256}
    environment:
      POSTGRES_USER: nutripey
      POSTGRES_DB: nutripey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Contraseña hexadecimal}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nutripey -d nutripey']
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: 1
    restart: unless-stopped
    logging: *bounded_logs
networks:
  frontend:
  database:
    internal: true
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
