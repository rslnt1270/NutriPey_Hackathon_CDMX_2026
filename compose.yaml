services:
  app:
    image: nutripey-local:0.1.0
    build:
      context: .
      args:
        BUILD_CPUSET: ${BUILD_CPUSET:-0,1}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://nutripey:${POSTGRES_PASSWORD:?Use una clave hexadecimal local}@db:5432/nutripey
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, database]
    cpus: 1
    cpuset: ${BUILD_CPUSET:-0,1}
    restart: unless-stopped
  db:
    image: docker.io/library/postgres:18.6-bookworm
    environment:
      POSTGRES_USER: nutripey
      POSTGRES_DB: nutripey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use una clave hexadecimal local}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nutripey -d nutripey']
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: 1
    cpuset: ${BUILD_CPUSET:-0,1}
    restart: unless-stopped
networks:
  frontend:
  database:
    internal: true
volumes:
  postgres-data:
