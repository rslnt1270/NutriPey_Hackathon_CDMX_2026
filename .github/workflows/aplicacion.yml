name: Aplicación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  base:
    name: Base Next.js y PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: nutripey_test
          POSTGRES_PASSWORD: prueba_solo_ci
          POSTGRES_DB: nutripey_test
        ports:
          - 5432:5432
        options: >-
          --cpus 1 --cpuset-cpus 0,1
          --health-cmd "pg_isready -U nutripey_test -d nutripey_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://nutripey_test:prueba_solo_ci@127.0.0.1:5432/nutripey_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: python3 scripts/con_dos_cpu.py npm run check
